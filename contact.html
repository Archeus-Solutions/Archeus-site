<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="contact.css">
        <title>Archeus | Kontakt oss</title>
    </head>
    <body>
        <nav>
            <div class="left-area">
                <a href="index.html" class="navbar-logo">
                    <img class="logo" src="assets/svgs/archeus-icon.svg" alt="archeus-logo">
                    <h1>archeus</h1>
                </a>
            </div>
            <div class="right-area">
                <a href="services.html">Tjenester</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="about.html">Om oss</a>
                <button class="navbar-book" onclick="gotoPage('contact.html')">
                    <p href="contact.html">Book et møte<span aria-hidden="true">↗</span></p>
                </button>
            </div>
        </nav>

        <div class="content-wrapper">
            <!-- E-post boksen -->
            <div id="crm-card">
                <div id="crm-card-header">
                    <h1>Send oss en e-post</h1>
                    <p class="crm-card-description">Fyll ut skjemaet under, så svarer vi deg vanligvis innen 24 timer.</p>
                </div>

                <form action="#" method="POST" id="contact-form">
                    <div class="form-group">
                        <label for="name">Navn *</label>
                        <input type="text" id="name" name="name" required placeholder="Ditt navn">
                    </div>

                    <div class="form-group">
                        <label for="email">E-post *</label>
                        <input type="email" id="email" name="email" required placeholder="din.epost@adresse.no">
                    </div>

                    <div class="form-group">
                        <label for="company">Selskap (valgfritt)</label>
                        <input type="text" id="company" name="company" placeholder="Selskapsnavn">
                    </div>

                    <div class="form-group">
                        <label for="message">Melding *</label>
                        <textarea id="message" name="message" required placeholder="Hva kan vi hjelpe deg med?"></textarea>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span>Send e-post</span>
                        <span aria-hidden="true">→</span>
                    </button>
                </form> 
            </div>

            <!-- Informasjonskortet -->
            <div id="contact-card">
                <div id="contact-card-header">
                    <h1>Kontaktinformasjon</h1>
                </div>
                
                <!-- Row 1: E-post -->
                <div class="info-row">
                    <p class="label">E-post</p>
                    <p class="value"><a href="mailto:post@archeus.solutions">post@archeus.solutions</a></p>
                </div>

                <!-- Row 2: Telefon -->
                <div class="info-row">
                    <p class="label">Telefon</p>
                    <p class="value"><a href="tel:+4741287234">41 28 72 34</a></p>
                </div>

                <!-- Row 3: Arbeidstider -->
                <div class="info-row">
                    <p class="label">Arbeidstider</p>
                    <p class="value">09:00 - 17:00</p>
                </div>
            </div>
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
